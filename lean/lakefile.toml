name = "RwLog"
allowNonModules = true
defaultTargets = ["RwLog", "AxiomAudit"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.35.0"

[[lean_lib]]
name = "RwLog"
allowNonModules = true

[[lean_lib]]
name = "AxiomAudit"
allowNonModules = true
