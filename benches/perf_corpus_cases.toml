[[case]]
id = "multi_head_chr_join"
title = "Multi-Head CHR Join"
tier = "stress"
category = "constraints"
description = "Multi-head CHR rule (p $x $y), (q $y $z) <=> (p $x $z); tests multi-head join path."
mode = "exhaust"
expected_kind = "exact"
expected_value = 1
program = """
theory join_theory {
    constraint p/2
    constraint q/2

    (p $x $y), (q $y $z) <=> (p $x $z).
}
rel test_join {
    a { (p a b), (q b c) } -> a
}
"""
query = "@a ; test_join"
tags = ["chr", "multi_head", "join", "stress"]
determinism = "nondeterministic"
answer_shape = "single"
infinite_stream = false
