name = "RwLogVerified"
defaultTargets = ["RwlogCore", "RwLogVerified", "AxiomAudit"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "RwLog"
path = "../../lean"

[[require]]
name = "aeneas"
git = "https://github.com/AeneasVerif/aeneas"
rev = "5a392f4b80a4d0d05abc240eb2a7fa70622a9a35"
subDir = "backends/lean"

# Generated by Aeneas from ../rust (see ../extract.sh). Not edited by hand.
[[lean_lib]]
name = "RwlogCore"
globs = ["RwlogCore.+"]

[[lean_lib]]
name = "RwLogVerified"

[[lean_lib]]
name = "AxiomAudit"
