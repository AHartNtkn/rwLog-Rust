[package]
name = "rwlog_core"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[workspace]

# Aeneas models integer overflow as a panic. Every theorem proves the code does
# not panic, so no overflow happens in a run the theorems cover; the check is
# kept on so that the compiled code and the model agree on every other run too.
[profile.release]
overflow-checks = true

# The tests enumerate terms and walk terms four hundred thousand deep and
# lists a hundred thousand long, so they are built with optimisation: the
# whole suite must end in ten seconds, with room to spare on a slower
# machine.
[profile.test]
opt-level = 2
