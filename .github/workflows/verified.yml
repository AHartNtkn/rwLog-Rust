name: Verified Rust

# A branch is checked through its pull request. A push is checked only on
# master, so a push to a pull request's branch does not run everything twice.
on:
  push:
    branches: [ master ]
    paths:
      - "verified/**"
      - "lean/**"
      - ".github/workflows/verified.yml"
  pull_request:
    paths:
      - "verified/**"
      - "lean/**"
      - ".github/workflows/verified.yml"

# A newer push to a pull request replaces the run of the older one. Runs on
# master are never cancelled, so every commit there has a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: verified/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build tests
        run: cargo test --no-run
      - name: Run tests
        run: timeout 10 cargo test

  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: verified/lean
          use-mathlib-cache: true
          build-args: "--wfail"
