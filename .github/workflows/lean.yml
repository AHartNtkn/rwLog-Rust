name: Lean formalization

# A branch is checked through its pull request. A push is checked only on
# master, so a push to a pull request's branch does not run everything twice.
on:
  push:
    branches: [ master ]
    paths:
      - "lean/**"
      - ".github/workflows/lean.yml"
  pull_request:
    paths:
      - "lean/**"
      - ".github/workflows/lean.yml"

# A newer push to a pull request replaces the run of the older one. Runs on
# master are never cancelled, so every commit there has a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          use-mathlib-cache: true
          build-args: "--wfail"
